
---
services:
  db:
    image: vamsi01/vamsi_repo:database
    ports:
      - "3306:3306"
    volumes:
      - vol1:/var/lib/mysql
    networks:
      - network1
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: 100M
          cpus: "0.25"
        limits:
          memory: 200M
          cpus: "0.4"

  auth_service:
    image: vamsi01/vamsi_repo:auth
    ports:
      - "5001:5001"
    networks:
      - network1
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 100M
          cpus: "0.25"
        limits:
          memory: 200M
          cpus: "0.4"

  book_service:
    image: vamsi01/vamsi_repo:book
    ports:
      - "5002:5002"
    networks:
      - network1
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 100M
          cpus: "0.25"
        limits:
          memory: 200M
          cpus: "0.4"

  borrow_service:
    image: vamsi01/vamsi_repo:borrow
    ports:
      - "5003:5003"
    networks:
      - network1
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 100M
          cpus: "0.25"
        limits:
          memory: 200M
          cpus: "0.4"

  frontend:
    image: vamsi01/vamsi_repo:frontend
    ports:
      - "5000:5000"
    networks:
      - network1
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 100M
          cpus: "0.25"
        limits:
          memory: 200M
          cpus: "0.4"

volumes:
  vol1:

networks:
  network1:
    driver: overlay
